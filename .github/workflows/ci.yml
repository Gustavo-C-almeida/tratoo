# CI do Tratoo: build + testes nos PRs e nos pushes de staging e main.
# Fluxo completo em Docs/CICD.md.
#
# Sem segredos de propósito: a suíte usa chave de dados própria (ConfiguracaoDosTestes)
# e o appsettings.json não está no git, então nada aqui alcança o Neon de produção.
# Os testes de integração sobem Postgres (pgvector) e Redis reais via `docker run` —
# o runner ubuntu-latest já tem Docker.
#
# As duas execuções não são redundantes: a de PR testa o resultado do merge, e a de push
# é o check do commit que a Railway espera antes de publicar staging e main. Branches de
# feature não têm push aqui; rodam pelo PR.
#
# Sem filtro de paths: um check obrigatório que não roda deixa o PR preso em "Expected".
name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

permissions:
  contents: read

# Um push novo no mesmo PR cancela a execução anterior. Em push nas branches longas não
# cancela: o check cancelado de um commit impediria a Railway de publicá-lo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # O GitHub não tem regra nativa de branch de origem, então este job só bloqueia depois
  # de virar check obrigatório de staging e main (Docs/CICD.md).
  origem-do-pr:
    name: Origem do PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      # Via env, nunca interpolado no script: o nome da branch é entrada não confiável.
      - name: Conferir a branch de origem
        env:
          BRANCH_DESTINO: ${{ github.base_ref }}
          BRANCH_ORIGEM: ${{ github.head_ref }}
          REPO_ORIGEM: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$REPO_ORIGEM" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::PR para $BRANCH_DESTINO precisa sair deste repositório (Docs/CICD.md)."
            exit 1
          fi
          # revert-* é o nome que o botão Revert do GitHub dá à branch da retirada.
          case "$BRANCH_DESTINO:$BRANCH_ORIGEM" in
            main:staging | main:hotfix/*) ;;
            staging:feature/* | staging:fix/* | staging:hotfix/* | staging:revert-*) ;;
            main:*)
              echo "::error::PR para a main só pode sair de staging ou hotfix/* (Docs/CICD.md)."
              exit 1
              ;;
            *)
              echo "::error::PR para a staging só pode sair de feature/*, fix/*, hotfix/* ou revert-* (Docs/CICD.md)."
              exit 1
              ;;
          esac


  build-e-testes:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # Sem Docker, os testes de integração FALHAM em vez de serem ignorados
      # (DockerCli.Exigido) — o pipeline nunca fica verde sem tê-los rodado.
      TRATOO_EXIGIR_DOCKER: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # histórico completo para comparar com a base

      # Atalho para mudança SÓ de documentação: o check "Build e testes" continua sendo
      # reportado (é obrigatório em staging e main, sem bypass), mas passa sem build nem
      # testes. Conservador: só vale se TODOS os arquivos alterados estiverem em Docs/ ou
      # forem .md na raiz; qualquer outro arquivo, ou não conseguir calcular a diferença
      # (branch nova, histórico ausente), roda a CI completa.
      - name: Classificar a mudança
        id: mudanca
        env:
          EVENTO: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          ANTES_PUSH: ${{ github.event.before }}
        run: |
          if [ "$EVENTO" = "pull_request" ]; then base="$BASE_PR"; else base="$ANTES_PUSH"; fi
          so_docs=false
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] \
             && arquivos="$(git diff --name-only "$base" HEAD)" && [ -n "$arquivos" ]; then
            echo "Arquivos alterados:"; echo "$arquivos" | sed 's/^/  /'
            if ! echo "$arquivos" | grep -qvE '^(Docs/.+|[^/]+\.md)$'; then so_docs=true; fi
          else
            echo "Não foi possível calcular os arquivos alterados: CI completa."
          fi
          echo "so_docs=$so_docs" >> "$GITHUB_OUTPUT"
          if [ "$so_docs" = true ]; then
            echo "::notice::Só documentação (Docs/ ou .md na raiz): build e testes dispensados."
          fi

      # Mesma major do Dockerfile (sdk:8.0); global.json aceita qualquer 8.0.4xx+.
      - uses: actions/setup-dotnet@v6
        if: steps.mudanca.outputs.so_docs != 'true'
        with:
          dotnet-version: 8.0.x

      - name: Cache do NuGet
        if: steps.mudanca.outputs.so_docs != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Baixa as imagens antes dos testes: a fixture tem timeout próprio e o download
      # não deve competir com ele.
      - name: Imagens dos testes de integração
        if: steps.mudanca.outputs.so_docs != 'true'
        run: |
          docker pull -q pgvector/pgvector:pg16
          docker pull -q redis:7-alpine

      - name: Restore
        if: steps.mudanca.outputs.so_docs != 'true'
        run: dotnet restore Tratoo.sln

      - name: Build
        if: steps.mudanca.outputs.so_docs != 'true'
        run: dotnet build Tratoo.sln -c Release --no-restore

      - name: Testes
        if: steps.mudanca.outputs.so_docs != 'true'
        run: >
          dotnet test Tratoo.sln -c Release --no-build
          --logger "trx;LogFileName=resultados.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Publicar resultados dos testes
        if: always() && steps.mudanca.outputs.so_docs != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: resultados-testes
          path: TestResults/
          if-no-files-found: ignore
