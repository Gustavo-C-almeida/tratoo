# Configuração de deploy da Railway versionada no repositório.
#
# Deliberadamente mínimo: só declara o que precisa mudar. Campos não
# especificados aqui continuam valendo o que está no dashboard — não sobrescreve
# builder, região, réplicas nem variáveis.
#
# O build já usava DOCKERFILE (confirmado via `railway status --json`), então
# nada de [build] aqui.

[deploy]
# A Railway usa este caminho durante o deploy para decidir quando a nova versão
# pode receber tráfego. Por isso é readiness (PostgreSQL + pgvector), não
# liveness: promover uma instância que não fala com o banco só transfere o erro
# para o usuário. Considera saudável em HTTP 2xx.
#
# Consequência aceita: indisponibilidade do Neon bloqueia deploys. É o
# comportamento desejado — melhor não promover do que promover quebrado.
healthcheckPath = "/health/ready"

# healthcheckTimeout NÃO é declarado de propósito: o default da Railway (300s) é
# mais folgado que qualquer valor que eu escolhesse aqui, e o Program.cs roda o
# VectorDbInitializer (CREATE EXTENSION, tabelas, índices HNSW) antes de servir —
# em cold start do Neon isso leva tempo. Reduzir a margem só criaria risco de
# deploy falhar sem motivo.

# Tempo entre o SIGTERM e o SIGKILL enviados à versão anterior, depois que a
# nova já está ativa (ou seja, ela não recebe mais tráfego novo — só termina o
# que está em andamento). O default da Railway é 0s: o processo era morto no
# meio do encerramento. Número, conforme https://railway.com/railway.schema.json.
#
# 30s = ShutdownTimeout do host .NET (25s, ShutdownSetup.TimeoutEncerramento)
# + 5s de margem para descartar conexões do Npgsql e fazer flush do Serilog
# depois que o Kestrel e os hosted services param. Se mudar um, mude o outro —
# ShutdownTests falha se o host deixar de caber dentro deste prazo.
drainingSeconds = 30
